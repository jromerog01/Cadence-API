[project]
name = "cadence-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
    "rq==2.12.0",
    "redis==5.2.1",
    "faster-whisper==1.2.1",
    # faster-whisper declara av>=11 sin tope y llama av.open(metadata_errors=...),
    # argumento que av 19 ya no acepta. Fijado a una versión que sí lo tiene.
    "av==16.0.0",
    "weasyprint==69.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/adapters", "src/api", "src/worker"]
