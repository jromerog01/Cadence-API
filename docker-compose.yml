services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    networks: [cadence]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    networks: [cadence]

  api:
    build:
      context: ./backend
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadence}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cadence}
      REDIS_URL: redis://redis:6379/0
      AUDIO_STORAGE_DIR: /data/audio
      AUDIO_MAX_SIZE_BYTES: ${AUDIO_MAX_SIZE_BYTES:-524288000}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - audio_storage:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${API_MEM_LIMIT:-512m}
    networks: [cadence]

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "worker.run"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadence}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cadence}
      REDIS_URL: redis://redis:6379/0
      AUDIO_STORAGE_DIR: /data/audio
      WHISPER_MODEL_CACHE_DIR: /models
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-0}
    volumes:
      - audio_storage:/data/audio
      - model_weights:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    networks: [cadence]

  caddy:
    build:
      context: .
      dockerfile: Caddyfile.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    networks: [cadence]

volumes:
  pgdata:
  audio_storage:
  model_weights:

networks:
  cadence:
